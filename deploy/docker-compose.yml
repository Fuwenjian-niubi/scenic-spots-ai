# 景点讲解 AI —— AnythingLLM 部署配置
# ⚠️ 遗留方案（未维护）：当前主线为直连版（web/server.py，零 Docker）。
# 仅当需要完整 RAG 管理台时使用；代码中的 examples/demo_*.py 与之对应。
# 用法: docker compose up -d    访问: http://127.0.0.1:3001
#
# 全云端方案: 聊天走 DeepSeek，嵌入走智谱 embedding-3，无需本地 Ollama。
# 只需填两个 Key: DEEPSEEK_API_KEY 与 GENERIC_OPEN_AI_EMBEDDING_API_KEY。

services:
  anythingllm:
    image: mintplexlabs/anythingllm:latest
    container_name: anythingllm-scenic
    ports:
      - "3001:3001"
    environment:
      # ---------- 基础 ----------
      STORAGE_DIR: /app/server/storage
      SERVER_PORT: "3001"
      DISABLE_TELEMETRY: "true"
      # 生产必改: 两个 >=32 位随机字符串
      JWT_SECRET: "CHANGE_ME_TO_RANDOM_32PLUS_CHARS_01"
      AUTH_TOKEN: "scenic-admin-2026"           # 首次登录密码

      # ---------- 聊天大模型(云端 DeepSeek) ----------
      LLM_PROVIDER: "deepseek"
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:-YOUR_DEEPSEEK_KEY}"
      DEEPSEEK_MODEL_PREF: "deepseek-chat"

      # 备选: 本地离线(无网/隐私场景)。注释上面三行,取消下面四行:
      # LLM_PROVIDER: "ollama"
      # OLLAMA_BASE_PATH: "http://host.docker.internal:11434"
      # OLLAMA_MODEL_PREF: "qwen3:8b"
      # OLLAMA_MODEL_TOKEN_LIMIT: "8192"

      # ---------- 嵌入模型(云端智谱 embedding-3) ----------
      EMBEDDING_ENGINE: "generic-openai"
      EMBEDDING_BASE_PATH: "https://open.bigmodel.cn/api/paas/v4"
      EMBEDDING_MODEL_PREF: "embedding-3"
      GENERIC_OPEN_AI_EMBEDDING_API_KEY: "${ZHIPU_API_KEY:-YOUR_ZHIPU_KEY}"
      EMBEDDING_MODEL_MAX_CHUNK_LENGTH: "800"   # 中文嵌入最大块长(字符)

      # ---------- OCR(扫描件 PDF/图片) ----------
      TARGET_OCR_LANG: "chi_sim,eng"

      # ---------- 向量库(默认 LanceDB,本地最快,无需额外配置) ----------
      VECTOR_DB: "lancedb"

    volumes:
      - ./storage:/app/server/storage
      - ./collector:/app/collector
    restart: unless-stopped

